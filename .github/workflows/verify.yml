name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --bin wakeit --example update_probe
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml jsonschema
      - run: python scripts/check-brand-docs.py
      - run: python scripts/test-release.py
      - name: Native service and replacement checks
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          python scripts/check-native.py --binary "target/debug/wakeit$suffix" --probe "target/debug/examples/update_probe$suffix"
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Install NATS Server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.15.0-linux-amd64/nats-server /usr/local/bin/nats-server
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo build --locked --examples && cargo build --locked
      - run: python3 scripts/check-archive-upgrade.py
      - run: python3 scripts/check-session-upgrade.py
      - run: python3 scripts/check-device-auth-upgrade.py
      - run: python3 scripts/workspace_migration_checks.py
      - run: python3 scripts/github_auth_checks.py
      - run: python3 scripts/integration_workspaces.py
      - name: Service integration
        shell: bash
        run: python3 scripts/integration.py 2>&1 | tee .local-integration.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            .local-integration.log
            .local/integration-*/*.log
