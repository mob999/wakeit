name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --bin wakeit --example update_probe
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml jsonschema
      - run: python scripts/check-brand-docs.py
      - run: python scripts/test-release.py
      - name: Native service and replacement checks
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          python scripts/check-native.py --binary "target/debug/wakeit$suffix" --probe "target/debug/examples/update_probe$suffix"
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Install NATS Server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.15.0-linux-amd64/nats-server /usr/local/bin/nats-server
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - run: cargo build --locked --examples && cargo build --locked
      - run: python3 scripts/check-archive-upgrade.py
      - run: python3 scripts/check-session-upgrade.py
      - run: python3 scripts/check-device-auth-upgrade.py
      - name: Service and browser integration
        run: |
          python3 scripts/integration.py --keep-running > .local-integration.log 2>&1 &
          stack_pid=$!
          trap 'kill "$stack_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if test -f .local/integration-stack.json; then break; fi
            if ! kill -0 "$stack_pid" 2>/dev/null; then cat .local-integration.log; exit 1; fi
            sleep 2
          done
          test -f .local/integration-stack.json
          cat .local-integration.log
          cd web && npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            web/test-results/
            .local-integration.log
            .local/integration-*/*.log
