name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      web: ${{ steps.select.outputs.web }}
      cli: ${{ steps.select.outputs.cli }}
      gateway: ${{ steps.select.outputs.gateway }}
      core: ${{ steps.select.outputs.core }}
      integration: ${{ steps.select.outputs.integration }}
      docs: ${{ steps.select.outputs.docs }}
      packaging: ${{ steps.select.outputs.packaging }}
      installer: ${{ steps.select.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/test-ci-scope.py
      - id: select
        run: python scripts/ci_scope.py
  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npm run build
        working-directory: web
      - run: npm run test:unit
        if: needs.scope.outputs.frontend == 'true'
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.gateway == 'true' || needs.scope.outputs.integration == 'true'
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
  cli:
    needs: scope
    if: needs.scope.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p wakeit-cli -p wakeit-agent-runtime --check
        if: runner.os == 'Linux'
      - run: cargo clippy --locked -p wakeit-cli -p wakeit-agent-runtime --all-targets -- -D warnings
      - run: cargo build --locked -p wakeit-agent-runtime
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage the development plugin bundle
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          version="$(python -c 'import tomllib; print(tomllib.load(open("crates/wakeit-cli/Cargo.toml","rb"))["package"]["version"])')"
          python scripts/package-release.py stage --input "target/debug/wakeit$suffix" --output "target/debug/wakeit-plugins/$version"
      - run: cargo test --locked -p wakeit-cli -p wakeit-agent-runtime --all-targets
      - run: cargo build --locked -p wakeit-cli --bin wakeit --example update_probe
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: CLI replacement checks
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          target="$(rustc -vV | sed -n 's/^host: //p')"
          python scripts/package-release.py binary --product cli --target "$target" --input "target/debug/wakeit$suffix" --output .local/native-cli
          python scripts/check-native.py --product cli --binary "target/debug/wakeit$suffix" --probe "target/debug/examples/update_probe$suffix" --bundle ".local/native-cli/wakeit-$target.tar.gz"
  gateway:
    needs: [scope, web]
    if: needs.scope.outputs.gateway == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: web-dist, path: web/dist}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p wakeit-gateway --check
        if: runner.os == 'Linux'
      - run: cargo clippy --locked -p wakeit-gateway --all-targets -- -D warnings
      - run: cargo test --locked -p wakeit-gateway --all-targets
      - run: cargo build --locked -p wakeit-gateway --bin wakeit-gateway
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Gateway service checks
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          python scripts/check-native.py --product gateway --binary "target/debug/wakeit-gateway$suffix"
  core:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p wakeit-core --check
        if: runner.os == 'Linux'
      - run: cargo clippy --locked -p wakeit-core --all-targets -- -D warnings
      - run: cargo test --locked -p wakeit-core --all-targets
  integration:
    needs: [scope, web]
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: web-dist, path: web/dist}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Install NATS Server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz | tar xz
          sudo install nats-server-v2.15.0-linux-amd64/nats-server /usr/local/bin/nats-server
      - run: cargo build --locked --workspace --bins --examples
      - run: python scripts/package-release.py stage --input target/debug/wakeit --output "target/debug/wakeit-plugins/$(target/debug/wakeit --version | cut -d' ' -f2)"
      - run: python3 scripts/workspace_migration_checks.py
      - run: python3 scripts/github_auth_checks.py
      - run: python3 scripts/integration_workspaces.py
      - name: Service integration
        shell: bash
        run: python3 scripts/integration.py 2>&1 | tee .local-integration.log
      - name: Payload isolation and offline delivery
        run: python3 scripts/integration.py --transport-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            .local-integration.log
            .local/integration-*/*.log
  docs:
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml jsonschema
      - run: python scripts/check-brand-docs.py
      - run: python scripts/changelog.py
  packaging:
    needs: scope
    if: needs.scope.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/test-release.py
  installer:
    needs: scope
    if: needs.scope.outputs.installer == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/test-installer.py
  verify-result:
    needs: [scope, web, cli, gateway, core, integration, docs, packaging, installer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/ci_scope.py --check-results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
