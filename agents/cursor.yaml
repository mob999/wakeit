version: 1
id: cursor
name: Cursor
logo: /agent-logos/cursor.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
submit:
  command: wakeit
  args:
    - adapter
    - stream
    - cursor
    - '--'
    - cursor-agent
    - --print
    - --output-format
    - stream-json
    - when_set: model
      args: [--model, '{{parameters.model}}']
    - '--'
    - '{{task.prompt}}'
detect:
  command: wakeit
  args: [adapter, detect, cursor]
  timeout: 10s
output:
  format: events
