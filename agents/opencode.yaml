version: 1
id: opencode
name: OpenCode
logo: /agent-logos/opencode.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
models:
  command: wakeit
  args: [adapter, models, opencode]
  timeout: 25s
submit:
  command: wakeit
  args:
    - adapter
    - stream
    - opencode
    - '--'
    - opencode
    - run
    - --format
    - json
    - --title
    - '{{session.title}}'
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
session:
  list:
    command: wakeit
    args: [adapter, session, list, opencode, --limit, '10000']
    timeout: 25s
  inspect:
    command: wakeit
    args: [adapter, session, inspect, opencode, '{{session.id}}']
    timeout: 20s
  resume:
    command: wakeit
    args:
      - adapter
      - session
      - resume
      - opencode
      - '{{session.id}}'
      - '--'
      - opencode
      - run
      - --session
      - '{{session.id}}'
      - --format
      - json
      - when_set: model
        args: [--model, '{{parameters.model}}']
    stdin: '{{task.prompt}}'
  interactive:
    command: opencode
    args: ['--session', '{{session.id}}']
detect:
  command: opencode
  args: [--version]
  timeout: 10s
output:
  format: events
