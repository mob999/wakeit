version: 1
id: copilot
name: GitHub Copilot CLI
logo: /agent-logos/copilot.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
submit:
  command: wakeit
  args:
    - plugin
    - exec
    - git:github.com/mob999/wakeit
    - adapter
    - "--"
    - stream
    - copilot
    - '--'
    - copilot
    - --no-ask-user
    - --output-format
    - json
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
detect:
  command: wakeit
  args: [plugin, exec, "git:github.com/mob999/wakeit", adapter, "--", detect, copilot]
  timeout: 10s
output:
  format: events
