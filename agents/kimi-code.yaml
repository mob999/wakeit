version: 1
id: kimi-code
name: Kimi Code
mode: sync
parameters:
  model: {type: string, label: 模型}
submit:
  command: wakeit
  args:
    - adapter
    - stream
    - kimi-code
    - '--'
    - kimi
    - --prompt
    - '{{task.prompt}}'
    - --output-format
    - stream-json
    - when_set: model
      args: [--model, '{{parameters.model}}']
session:
  list:
    command: wakeit
    args: [adapter, session, list, kimi-code, --limit, '10000']
    timeout: 25s
  inspect:
    command: wakeit
    args: [adapter, session, inspect, kimi-code, '{{session.id}}']
    timeout: 25s
  resume:
    command: wakeit
    args:
      - adapter
      - session
      - resume
      - kimi-code
      - '{{session.id}}'
      - '--'
      - kimi
      - --session
      - '{{session.id}}'
      - --prompt
      - '{{task.prompt}}'
      - --output-format
      - stream-json
      - when_set: model
        args: [--model, '{{parameters.model}}']
  interactive:
    command: kimi
    args: [--session, '{{session.id}}']
detect:
  command: wakeit
  args: [adapter, detect, kimi-code]
  timeout: 10s
output:
  format: events
