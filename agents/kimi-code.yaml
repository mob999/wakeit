version: 1
id: kimi-code
name: Kimi Code
logo: /agent-logos/kimi-code.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
submit:
  command: wakeit
  args:
    - adapter
    - kimi
    - --title
    - '{{session.title}}'
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
session:
  list:
    command: wakeit
    args: [adapter, session, list, kimi-code, --limit, '10000']
    timeout: 25s
  inspect:
    command: wakeit
    args: [adapter, session, inspect, kimi-code, '{{session.id}}']
    timeout: 25s
  resume:
    command: wakeit
    args:
      - adapter
      - kimi
      - --session
      - '{{session.id}}'
      - when_set: model
        args: [--model, '{{parameters.model}}']
    stdin: '{{task.prompt}}'
  interactive:
    command: kimi
    args: [--session, '{{session.id}}']
detect:
  command: wakeit
  args: [adapter, detect, kimi-code]
  timeout: 10s
output:
  format: events
