version: 1
id: kimi-code
name: Kimi Code
logo: /agent-logos/kimi-code.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
submit:
  command: wakeit
  args:
    - plugin
    - exec
    - git:github.com/mob999/wakeit
    - adapter
    - "--"
    - kimi
    - --title
    - '{{session.title}}'
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
session:
  list:
    command: wakeit
    args: [plugin, exec, "git:github.com/mob999/wakeit", adapter, "--", session, list, kimi-code, --limit, '10000']
    timeout: 25s
  inspect:
    command: wakeit
    args: [plugin, exec, "git:github.com/mob999/wakeit", adapter, "--", session, inspect, kimi-code, '{{session.id}}']
    timeout: 25s
  resume:
    command: wakeit
    args:
      - plugin
      - exec
      - git:github.com/mob999/wakeit
      - adapter
      - "--"
      - kimi
      - --session
      - '{{session.id}}'
      - when_set: model
        args: [--model, '{{parameters.model}}']
    stdin: '{{task.prompt}}'
  interactive:
    command: kimi
    args: [--session, '{{session.id}}']
detect:
  command: wakeit
  args: [plugin, exec, "git:github.com/mob999/wakeit", adapter, "--", detect, kimi-code]
  timeout: 10s
output:
  format: events
