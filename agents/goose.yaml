version: 1
id: goose
name: Goose
logo: /agent-logos/goose.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
  provider: {type: string, label: Provider}
submit:
  command: wakeit
  args:
    - plugin
    - exec
    - git:github.com/mob999/wakeit
    - adapter
    - "--"
    - stream
    - goose
    - '--'
    - goose
    - run
    - --instructions
    - '-'
    - --output-format
    - stream-json
    - --quiet
    - when_set: provider
      args: [--provider, '{{parameters.provider}}']
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
detect:
  command: wakeit
  args: [plugin, exec, "git:github.com/mob999/wakeit", adapter, "--", detect, goose]
  timeout: 10s
output:
  format: events
