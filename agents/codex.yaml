version: 1
id: codex
name: Codex
logo: /agent-logos/codex.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
  reasoning: {type: string, label: 推理强度}
models:
  command: wakeit
  args: [adapter, models, codex]
  timeout: 25s
submit:
  command: wakeit
  args:
    - adapter
    - stream
    - codex
    - '--'
    - codex
    - exec
    - --json
    - when_set: model
      args: [--model, '{{parameters.model}}']
    - when_set: reasoning
      args: [-c, 'model_reasoning_effort="{{parameters.reasoning}}"']
    - '-'
  stdin: '{{task.prompt}}'
session:
  rename:
    command: wakeit
    args: [adapter, session, rename, codex, '{{session.id}}', '{{session.title}}']
    timeout: 20s
  list:
    command: wakeit
    args: [adapter, session, list, codex, --limit, '10000']
    timeout: 25s
  inspect:
    command: wakeit
    args: [adapter, session, inspect, codex, '{{session.id}}']
    timeout: 20s
  resume:
    command: wakeit
    args:
      - adapter
      - session
      - resume
      - codex
      - '{{session.id}}'
      - '--'
      - codex
      - exec
      - resume
      - '{{session.id}}'
      - --json
      - when_set: model
        args: [--model, '{{parameters.model}}']
      - when_set: reasoning
        args: [-c, 'model_reasoning_effort="{{parameters.reasoning}}"']
      - '-'
    stdin: '{{task.prompt}}'
  interactive:
    command: codex
    args: ['resume', '{{session.id}}']
detect:
  command: codex
  args: [--version]
  timeout: 10s
output:
  format: events
