version: 1
id: agy
name: Antigravity CLI
logo: /agent-logos/agy.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
  reasoning: {type: string, label: 推理强度}
models:
  command: wakeit
  args: [plugin, exec, "git:github.com/mob999/wakeit", adapter, "--", models, agy]
  timeout: 25s
submit:
  command: wakeit
  args:
    - plugin
    - exec
    - git:github.com/mob999/wakeit
    - adapter
    - "--"
    - stream
    - agy
    - '--'
    - agy
    - --input-format
    - stream-json
    - --output-format
    - stream-json
    - --disable-slash-commands
    - when_set: model
      args: [--model, '{{parameters.model}}']
    - when_set: reasoning
      args: [--effort, '{{parameters.reasoning}}']
  stdin: '{{task.prompt}}'
detect:
  command: wakeit
  args: [plugin, exec, "git:github.com/mob999/wakeit", adapter, "--", detect, agy]
  timeout: 10s
output:
  format: events
