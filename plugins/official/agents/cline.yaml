version: 1
id: cline
name: Cline
logo: /agent-logos/cline.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
  provider: {type: string, label: Provider}
  reasoning: {type: string, label: 推理强度}
submit:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args:
    - stream
    - cline
    - '--'
    - cline
    - --json
    - when_set: provider
      args: [--provider, '{{parameters.provider}}']
    - when_set: model
      args: [--model, '{{parameters.model}}']
    - when_set: reasoning
      args: [--thinking, '{{parameters.reasoning}}']
    - '--'
    - '{{task.prompt}}'
detect:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args: [ detect, cline]
  timeout: 10s
output:
  format: events
