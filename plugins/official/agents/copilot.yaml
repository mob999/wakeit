version: 1
id: copilot
name: GitHub Copilot CLI
logo: /agent-logos/copilot.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
submit:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args:
    - stream
    - copilot
    - '--'
    - copilot
    - --no-ask-user
    - --output-format
    - json
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
detect:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args: [ detect, copilot]
  timeout: 10s
output:
  format: events
