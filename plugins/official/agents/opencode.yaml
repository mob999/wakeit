version: 1
id: opencode
name: OpenCode
logo: /agent-logos/opencode.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
models:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args: [ models, opencode]
  timeout: 25s
submit:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args:
    - stream
    - opencode
    - '--'
    - opencode
    - run
    - --format
    - json
    - --title
    - '{{session.title}}'
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
session:
  list:
    command: ./plugins/official/bin/wakeit-agent-runtime
    args: [ session, list, opencode, --limit, '10000']
    timeout: 25s
  inspect:
    command: ./plugins/official/bin/wakeit-agent-runtime
    args: [ session, inspect, opencode, '{{session.id}}']
    timeout: 20s
  resume:
    command: ./plugins/official/bin/wakeit-agent-runtime
    args:
      - session
      - resume
      - opencode
      - '{{session.id}}'
      - '--'
      - opencode
      - run
      - --session
      - '{{session.id}}'
      - --format
      - json
      - when_set: model
        args: [--model, '{{parameters.model}}']
    stdin: '{{task.prompt}}'
  interactive:
    command: opencode
    args: ['--session', '{{session.id}}']
detect:
  command: opencode
  args: [--version]
  timeout: 10s
output:
  format: events
