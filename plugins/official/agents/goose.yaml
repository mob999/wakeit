version: 1
name: Goose
logo: /agent-logos/goose.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
  provider: {type: string, label: Provider}
submit:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args:
    - stream
    - goose
    - '--'
    - goose
    - run
    - --instructions
    - '-'
    - --output-format
    - stream-json
    - --quiet
    - when_set: provider
      args: [--provider, '{{parameters.provider}}']
    - when_set: model
      args: [--model, '{{parameters.model}}']
  stdin: '{{task.prompt}}'
detect:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args: [ detect, goose]
  timeout: 10s
output:
  format: events
