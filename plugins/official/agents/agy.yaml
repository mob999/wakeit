version: 1
name: Antigravity CLI
logo: /agent-logos/agy.svg
mode: sync
parameters:
  model: {type: string, label: 模型}
  reasoning: {type: string, label: 推理强度}
models:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args: [ models, agy]
  timeout: 25s
submit:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args:
    - stream
    - agy
    - '--'
    - agy
    - --input-format
    - stream-json
    - --output-format
    - stream-json
    - --disable-slash-commands
    - when_set: model
      args: [--model, '{{parameters.model}}']
    - when_set: reasoning
      args: [--effort, '{{parameters.reasoning}}']
  stdin: '{{task.prompt}}'
detect:
  command: ./plugins/official/bin/wakeit-agent-runtime
  args: [ detect, agy]
  timeout: 10s
output:
  format: events
