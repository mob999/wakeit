services:
  init:
    build: ..
    image: wakeit:local
    profiles: [tools]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/auth /data/nats1 /data/nats2 /data/nats3
        chown 10001:10001 /data/auth /data/nats1 /data/nats2 /data/nats3
        if [ ! -f /data/auth/operator.seed ]; then
          runuser -u wakeit -- wakeit gateway nats-init --dir /data/auth --host 0.0.0.0 --port 4222 --ws-port 8081
        fi
    volumes: ["identity:/data/auth", "nats1:/data/nats1", "nats2:/data/nats2", "nats3:/data/nats3"]
  migrate:
    image: wakeit:local
    profiles: [tools]
    command: [gateway, migrate, --config, /app/gateway.yaml]
    environment:
      WAKEIT_DATABASE_URL: ${WAKEIT_DATABASE_URL:?Set the external PostgreSQL URL}
    volumes: ["identity:/data/auth:ro"]
  nats-1:
    image: nats:2.15-alpine
    user: "10001:10001"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        sed -e 's/server_name: wakeit-local/server_name: wakeit-1/' -e 's|"/data/auth/resolver"|"/data/store/resolver"|' -e 's|"/data/auth/jetstream"|"/data/store/jetstream"|' /data/auth/nats.conf > /tmp/nats.conf
        printf '\ncluster { name: wakeit, listen: "0.0.0.0:6222", routes: ["nats://nats-2:6222","nats://nats-3:6222"] }\n' >> /tmp/nats.conf
        exec /nats-server -c /tmp/nats.conf
    volumes: ["identity:/data/auth:ro", "nats1:/data/store"]
    restart: unless-stopped
  nats-2:
    image: nats:2.15-alpine
    user: "10001:10001"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        sed -e 's/server_name: wakeit-local/server_name: wakeit-2/' -e 's|"/data/auth/resolver"|"/data/store/resolver"|' -e 's|"/data/auth/jetstream"|"/data/store/jetstream"|' /data/auth/nats.conf > /tmp/nats.conf
        printf '\ncluster { name: wakeit, listen: "0.0.0.0:6222", routes: ["nats://nats-1:6222","nats://nats-3:6222"] }\n' >> /tmp/nats.conf
        exec /nats-server -c /tmp/nats.conf
    volumes: ["identity:/data/auth:ro", "nats2:/data/store"]
    restart: unless-stopped
  nats-3:
    image: nats:2.15-alpine
    user: "10001:10001"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        sed -e 's/server_name: wakeit-local/server_name: wakeit-3/' -e 's|"/data/auth/resolver"|"/data/store/resolver"|' -e 's|"/data/auth/jetstream"|"/data/store/jetstream"|' /data/auth/nats.conf > /tmp/nats.conf
        printf '\ncluster { name: wakeit, listen: "0.0.0.0:6222", routes: ["nats://nats-1:6222","nats://nats-2:6222"] }\n' >> /tmp/nats.conf
        exec /nats-server -c /tmp/nats.conf
    volumes: ["identity:/data/auth:ro", "nats3:/data/store"]
    restart: unless-stopped
  gateway-1:
    image: wakeit:local
    environment: &gateway-env
      WAKEIT_DATABASE_URL: ${WAKEIT_DATABASE_URL:?Set the external PostgreSQL URL}
      WAKEIT_NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      WAKEIT_NATS_REPLICAS: "3"
      WAKEIT_PUBLIC_URL: https://${WAKEIT_WEB_HOST:?Set WAKEIT_WEB_HOST}
      WAKEIT_NATS_PUBLIC_URL: wss://${WAKEIT_MQ_HOST:?Set WAKEIT_MQ_HOST}
      RUST_LOG: wakeit=info,tower_http=warn
    volumes: ["identity:/data/auth:ro"]
    depends_on: [nats-1, nats-2, nats-3]
    restart: unless-stopped
  gateway-2:
    image: wakeit:local
    environment: *gateway-env
    volumes: ["identity:/data/auth:ro"]
    depends_on: [nats-1, nats-2, nats-3]
    restart: unless-stopped
  ingress:
    image: caddy:2-alpine
    environment:
      WAKEIT_WEB_HOST: ${WAKEIT_WEB_HOST}
      WAKEIT_MQ_HOST: ${WAKEIT_MQ_HOST}
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data", "caddy-config:/config"]
    depends_on: [gateway-1, gateway-2]
    restart: unless-stopped
volumes:
  identity: {}
  nats1: {}
  nats2: {}
  nats3: {}
  caddy: {}
  caddy-config: {}
